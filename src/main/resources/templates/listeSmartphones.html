<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"> 
<link rel="stylesheet" type="text/css" 
href="webjars/bootstrap/4.3.1/css/bootstrap.min.css" /> 
<head> 
<meta charset="utf-8"> 
<title>Liste des smartphones</title> 
</head> 
<body> 
 <div th:replace="template"></div> 
<div class="container"> 
<div class="card"> 
  <div class="card-header"> 
    Liste des smartphones 
  </div> 
  <div class="card-body">     
      <table class="table table-striped"> 
        <tr> 
          <th>ID</th><th>Marque</th><th>Modele</th><th>ram</th><th>stockage</th><th>Prix</th>
         </tr>   
           <tr th:each="s:${smartphones.content}"> 
              <td th:text="${s.id}"></td> 
              <td th:text="${s.marque}"></td> 
              <td th:text="${s.modele}"></td>    
			  <td th:text="${s.ram}"></td>
			   <td th:text="${s.stockage}"></td> 
			   <td th:text="${s.prix}"></td> 
              <td><a class="btn btn-danger" onclick="return confirm('Etes-vous sûr ?')" th:href="@{supprimerSmartphone(id=${s.id}, 
page=${currentPage},size=${size})}">Supprimer</a></td>  
</tr>              
</table> 
<ul class="nav nav-pills"> 
<li th:each="page,status:${pages}"> 
<a th:class="${status.index==currentPage?'btn btn-primary':'btn'  }" th:href="@{ ListeSmartphones(page=${status.index}, size=${size} ) }" th:text="${status.index }"></a> 
</li> 
</ul> 
</div> 
</div> 
</div> 
</body> 
</html>
